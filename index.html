<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimpleGames.IO</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;font-size:22px;margin:0;color:#fff;text-align:center;background:linear-gradient(135deg,#7c3aed,#ec4899,#f59e0b);min-height:100vh;padding:14px}
h1{font-size:42px;margin:4px 0 10px}h2{font-size:30px;margin:0 0 8px}
.wrap{max-width:900px;margin:auto}
.panel{background:rgba(0,0,0,.38);border-radius:16px;padding:16px;margin-bottom:14px}
.totals{display:flex;gap:8px}.stat{flex:1;border-radius:12px;padding:8px;font-weight:bold}.stat span{display:block;font-size:34px}
.win{background:#16a34a}.loss{background:#dc2626}.rate{background:#2563eb}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{border:0;border-radius:12px;padding:12px 6px;color:#fff;font-size:19px;font-weight:bold;cursor:pointer}.tile:hover{transform:scale(1.06)}
.tile span{display:block;font-size:30px}
.btn{background:#facc15;color:#000;border:0;border-radius:10px;padding:10px 18px;margin:5px;font-size:22px;font-weight:bold;cursor:pointer}
.alt{background:#e2e8f0}.big{font-size:56px}
input[type=text],input[type=number]{padding:8px;font-size:22px;border-radius:8px;border:0;width:130px}
.slider{width:70%;height:30px}
table{width:100%;font-size:18px;border-collapse:collapse}td,th{padding:4px;border-bottom:1px solid #fff4}
summary{cursor:pointer;font-weight:bold}
.result{font-size:26px;font-weight:bold;margin:10px}
.cv{max-width:100%;height:auto;background:#0f172a;border-radius:10px;touch-action:none}
.g{display:grid;gap:6px;justify-content:center;margin:10px auto}
.cell{background:#6366f1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:bold;cursor:pointer;user-select:none}
.up{background:#fff;color:#000}
.pad{width:120px;height:120px;border:0;border-radius:14px;margin:4px;cursor:pointer}
.key{font-size:18px;width:40px;height:40px;margin:2px;border-radius:8px;border:0;cursor:pointer}
.opt{display:block;width:90%;margin:6px auto}
#arena{position:relative;height:260px;background:#0006;border-radius:12px;overflow:hidden}
#dot{position:absolute;border-radius:50%;background:#facc15;border:0;cursor:pointer}
</style></head><body>
<h1>🎮 Bored? Game Hub</h1>
<div class="wrap">
<div class="panel"><div class="totals">
<div class="stat win">Wins<span id="tw">0</span></div><div class="stat loss">Losses<span id="tl">0</span></div><div class="stat rate">Win rate<span id="tr">0%</span></div></div>
<details><summary>📊 Scores for each game</summary><table id="rows"></table><button class="btn alt" onclick="resetStats()" style="font-size:16px">Reset scores</button></details></div>
<div class="panel" id="stage"><p>Pick a game below. Every game has its own difficulty slider!</p></div>
<div class="panel"><div class="tiles" id="tiles"></div></div>
</div>
<script>
const $=s=>document.querySelector(s),rnd=n=>Math.floor(Math.random()*n),pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const LV=['Very Easy','Easy','Medium','Hard','Expert'];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const G=[],GM={};let cl=[];
const add=(id,name,em,desc,run)=>{const g={id,name,em,desc,run};G.push(g);GM[id]=g};
const cleanup=()=>{cl.forEach(f=>f());cl=[]};
let stats={},diffs={};
try{stats=JSON.parse(localStorage.getItem('gh25')||'{}');diffs=JSON.parse(localStorage.getItem('gh25d')||'{}')}catch(e){}
const sv=()=>{try{localStorage.setItem('gh25',JSON.stringify(stats));localStorage.setItem('gh25d',JSON.stringify(diffs))}catch(e){}};
function render(){let w=0,l=0,h='<tr><th>Game</th><th>W</th><th>L</th></tr>';
G.forEach(g=>{const s=stats[g.id]||{w:0,l:0};w+=s.w;l+=s.l;h+=`<tr><td>${g.em} ${g.name}</td><td>${s.w}</td><td>${s.l}</td></tr>`});
$('#tw').textContent=w;$('#tl').textContent=l;$('#tr').textContent=(w+l?Math.round(100*w/(w+l)):0)+'%';$('#rows').innerHTML=h}
function resetStats(){stats={};sv();render()}
function openGame(id){cleanup();const g=GM[id],d=diffs[id]||3;
$('#stage').innerHTML=`<h2>${g.em} ${g.name}</h2><p>${g.desc}</p><p>Difficulty: <b id="dl">${LV[d-1]}</b></p><input type="range" class="slider" id="sl" min="1" max="5" value="${d}"><p style="font-size:16px;margin:0">Slide left for easier, right for harder</p><button class="btn" onclick="launch('${id}')">▶ Start</button>`;
$('#sl').oninput=e=>{diffs[id]=+e.target.value;$('#dl').textContent=LV[e.target.value-1];sv()};
$('#stage').scrollIntoView({behavior:'smooth'})}
function launch(id,d){cleanup();d=d||diffs[id]||3;const g=GM[id];
$('#stage').innerHTML=`<h2>${g.em} ${g.name} <small style="font-size:18px">(${LV[d-1]})</small></h2><div id="play"></div>`;
const el=$('#play');let over=false;
const c={el,d,get over(){return over},
end(won,text){if(over)return;over=true;cleanup();if(won!==null){stats[id]=stats[id]||{w:0,l:0};stats[id][won?'w':'l']++;sv();render()}
el.insertAdjacentHTML('beforeend',`<div class="result">${won===null?'🤝 ':won?'🎉 You win! ':'😬 You lose. '}${text}</div><button class="btn" onclick="launch('${id}',${d})">Play again</button><button class="btn alt" onclick="openGame('${id}')">Change difficulty</button>`)},
every(f,ms){const t=setInterval(f,ms);cl.push(()=>clearInterval(t))},
later(f,ms){const t=setTimeout(f,ms);cl.push(()=>clearTimeout(t))},
key(f){const h=e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)&&!/INPUT/.test(document.activeElement.tagName))e.preventDefault();f(e)};document.addEventListener('keydown',h);cl.push(()=>document.removeEventListener('keydown',h))},
loop(f){let i,on=true;const s=()=>{if(!on)return;f();i=requestAnimationFrame(s)};i=requestAnimationFrame(s);cl.push(()=>{on=false;cancelAnimationFrame(i)})}};
g.run(c)}
const canvas=(c,w,h)=>{const k=document.createElement('canvas');k.width=w;k.height=h;k.className='cv';c.el.appendChild(k);return k};
const dpad=(c,cb)=>{const d=document.createElement('div');[['◀',-1,0],['▲',0,-1],['▼',0,1],['▶',1,0]].forEach(([t,x,y])=>{const b=document.createElement('button');b.className='btn';b.textContent=t;b.onclick=()=>cb(x,y);d.appendChild(b)});c.el.appendChild(d)};
const grid=(el,cols,w)=>{const d=document.createElement('div');d.className='g';d.style.gridTemplateColumns=`repeat(${cols},${w}px)`;el.appendChild(d);return d};
const tick=(c,T,f)=>{let t=T;c.every(()=>{t--;const e=$('#tm');if(e)e.textContent=t;if(t<=0)f()},1000)};
const W={s:['cat','dog','fish','bird','tree','moon','star','cake','boat','frog'],m:['planet','guitar','pencil','island','rocket','castle','jungle','basket','pirate','wizard'],l:['adventure','mountain','chocolate','dinosaur','telescope','volcano','crocodile','basketball','spaceship','waterfall']};
const wpool=d=>[W.s,W.s,W.m,W.l,W.l][d-1];

add('memory','Memory Match','🧠','Find all the pairs before you run out of moves.',c=>{
const P=[6,8,8,10,12][c.d-1],L=Math.round(P*(3-.4*(c.d-1)));
const em=['🐶','🍕','🚀','🎸','🌵','⚽','🐙','🍩','🦊','🎲','🍉','🐢'].slice(0,P);
c.el.innerHTML=`<p>Find ${P} pairs in ${L} moves. Moves: <b id="mv">0</b></p>`;
const g=grid(c.el,4,80);let f=null,lock=false,m=0,n=0;
shuffle([...em,...em]).forEach(e=>{const k=document.createElement('div');k.className='cell';k.style.cssText='height:70px;font-size:36px';
k.onclick=()=>{if(lock||c.over||k.classList.contains('up'))return;k.classList.add('up');k.textContent=e;
if(!f){f=k;return}const a=f;f=null;m++;$('#mv').textContent=m;
if(a.textContent===e){if(++n===P)return c.end(m<=L,`Finished in ${m} moves.`);if(m>=L)c.end(false,'Out of moves.')}
else{lock=true;c.later(()=>{a.classList.remove('up');a.textContent='';k.classList.remove('up');k.textContent='';lock=false;if(m>=L)c.end(false,'Out of moves.')},700)}};g.appendChild(k)})});

add('guess','Number Guess','🔢','Find the secret number with higher/lower hints.',c=>{
const M=[20,50,100,500,1000][c.d-1],T=[8,7,7,9,10][c.d-1],s=1+rnd(M);let n=0;
c.el.innerHTML=`<p>Pick a number from 1 to ${M}. You get ${T} tries.</p><input type="number" id="in"> <button class="btn" id="go">Guess</button><p id="msg"></p>`;
const go=()=>{const v=+$('#in').value;if(!v||c.over)return;n++;$('#in').value='';
if(v===s)return c.end(true,`Found it in ${n} tries.`);if(n>=T)return c.end(false,`The number was ${s}.`);
$('#msg').textContent=`${v<s?'Too low ⬆️':'Too high ⬇️'} (${T-n} tries left)`};
$('#go').onclick=go;$('#in').onkeydown=e=>{if(e.key==='Enter')go()}});

add('click','Catch the Dot','🎯','Click the dot as many times as you can in 15 seconds.',c=>{
const goal=[8,12,16,20,25][c.d-1],S=[80,64,50,40,32][c.d-1],hop=[0,0,1200,900,700][c.d-1];let sc=0;
c.el.innerHTML=`<p>Catch ${goal} dots. Score: <b id="sc">0</b> | Time: <b id="tm">15</b></p><div id="arena"><button id="dot" style="width:${S}px;height:${S}px"></button></div>`;
const A=$('#arena'),t=$('#dot'),mv=()=>{t.style.left=Math.random()*(A.clientWidth-S)+'px';t.style.top=Math.random()*(A.clientHeight-S)+'px'};
mv();t.onclick=()=>{$('#sc').textContent=++sc;if(sc>=goal)return c.end(true,`Caught ${sc} dots!`);mv()};
if(hop)c.every(mv,hop);tick(c,15,()=>c.end(sc>=goal,`You caught ${sc} dots.`))});

add('react','Reaction Test','⚡','Click when the box turns green. Three rounds, average counts.',c=>{
const lim=[600,450,350,300,250][c.d-1];let r=0,ts=[];
c.el.innerHTML=`<p>Average must be under ${lim} ms. <b id="rd"></b></p><div id="bx" style="height:170px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer"></div>`;
const bx=$('#bx');
const nx=()=>{r++;$('#rd').textContent=`Round ${r} of 3`;bx.style.background='#ef4444';bx.textContent='Wait for green...';let ok=false,t0=0;
c.later(()=>{ok=true;t0=Date.now();bx.style.background='#22c55e';bx.textContent='CLICK!'},1200+Math.random()*2800);
bx.onclick=()=>{if(!ok)return c.end(false,'Too early!');const ms=Date.now()-t0;ts.push(ms);bx.onclick=null;bx.style.background='#3b82f6';bx.textContent=ms+' ms';
if(r>=3){const a=Math.round(ts.reduce((x,y)=>x+y)/3);c.end(a<lim,`Average: ${a} ms.`)}else c.later(nx,900)}};nx()});

add('ttt','Tic-Tac-Toe','❌','You are X. Expert never loses, so a draw is the best you can do there.',c=>{
const p=[0,.4,.7,.9,1][c.d-1],b=Array(9).fill(''),L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let busy=false;
const w=s=>L.some(l=>l.every(i=>b[i]===s));
const mm=t=>{if(w('O'))return 1;if(w('X'))return -1;if(!b.includes(''))return 0;let best=t==='O'?-2:2;
b.forEach((v,i)=>{if(v)return;b[i]=t;const s=mm(t==='O'?'X':'O');b[i]='';best=t==='O'?Math.max(best,s):Math.min(best,s)});return best};
const cpu=()=>{const fr=b.map((v,i)=>v?-1:i).filter(i=>i>=0);if(Math.random()>p)return pick(fr);let bs=-2,mv=[];
fr.forEach(i=>{b[i]='O';const s=mm('X');b[i]='';if(s>bs){bs=s;mv=[i]}else if(s===bs)mv.push(i)});return pick(mv)};
c.el.innerHTML='<p>Get three in a row!</p>';const B=grid(c.el,3,100);
const dr=()=>{B.innerHTML='';b.forEach((v,i)=>{const k=document.createElement('div');k.className='cell';k.style.cssText='height:100px;font-size:50px';k.textContent=v==='X'?'❌':v==='O'?'⭕':'';k.onclick=()=>pl(i);B.appendChild(k)})};
const pl=i=>{if(b[i]||busy||c.over)return;b[i]='X';dr();if(w('X'))return c.end(true,'Three in a row!');if(!b.includes(''))return c.end(null,"It's a draw.");
busy=true;c.later(()=>{b[cpu()]='O';dr();busy=false;if(w('O'))return c.end(false,'The computer won.');if(!b.includes(''))c.end(null,"It's a draw.")},350)};dr()});

add('rps','Rock Paper Scissors','✂️','First to the target score wins. Harder levels learn your habits.',c=>{
const T=[2,3,3,4,4][c.d-1],sm=[0,0,.3,.5,.7][c.d-1],O=['🪨','📄','✂️'],h=[0,0,0];let me=0,cp=0;
c.el.innerHTML=`<p>First to ${T}. You <b id="m">0</b> | Computer <b id="c">0</b></p><div id="pk"></div><div class="big" id="sh">&nbsp;</div><p id="out"></p>`;
const go=i=>{if(c.over)return;let k=rnd(3);if(Math.random()<sm)k=(h.indexOf(Math.max(...h))+1)%3;h[i]++;
$('#sh').textContent=O[i]+' vs '+O[k];let r='Tie!';if(i!==k){if((i-k+3)%3===1){me++;r='You score!'}else{cp++;r='Computer scores!'}}
$('#out').textContent=r;$('#m').textContent=me;$('#c').textContent=cp;if(me>=T||cp>=T)c.end(me>=T,`Final score ${me} to ${cp}.`)};
O.forEach((o,i)=>{const b=document.createElement('button');b.className='btn big';b.textContent=o;b.onclick=()=>go(i);$('#pk').appendChild(b)})});

add('math','Math Sprint','➕','Answer 5 math questions before time runs out. Get 4 right.',c=>{
const T=[40,30,25,25,20][c.d-1],d=c.d;let right=0,asked=0,ans;
c.el.innerHTML=`<p>Time: <b id="tm">${T}</b></p><div class="big" id="q"></div><input type="number" id="in"> <button class="btn" id="go">Go</button><p id="fb"></p>`;
const pm=(x,y)=>{if(Math.random()<.5){ans=x+y;return `${x} + ${y}`}ans=x-y;return `${x} − ${y}`};
const mu=(a,b)=>{const x=a+rnd(b),y=a+rnd(b);ans=x*y;return `${x} × ${y}`};
const gen=()=>{let q;if(d===1){const x=1+rnd(15),y=1+rnd(15);ans=x+y;q=`${x} + ${y}`}
else if(d===2){const x=10+rnd(40);q=pm(x,1+rnd(x))}else if(d===3)q=mu(2,11);
else if(d===4)q=Math.random()<.5?mu(3,13):pm(30+rnd(70),10+rnd(20));else q=Math.random()<.6?mu(6,15):pm(100+rnd(200),20+rnd(80));
$('#q').textContent=q;$('#in').value='';$('#in').focus()};
const fin=()=>c.end(right>=4,`You got ${right} of 5 right.`);
const sub=()=>{const v=$('#in').value;if(v===''||c.over)return;asked++;if(+v===ans){right++;$('#fb').textContent='✅ Correct!'}else $('#fb').textContent='❌ It was '+ans;asked>=5?fin():gen()};
$('#go').onclick=sub;$('#in').onkeydown=e=>{if(e.key==='Enter')sub()};tick(c,T,fin);gen()});

add('snake','Snake','🐍','Eat apples without crashing. Use arrow keys, WASD, or the buttons.',c=>{
const ms=[190,140,105,80,60][c.d-1],goal=[5,8,10,12,15][c.d-1],N=16,S=22;
c.el.innerHTML=`<p>Eat ${goal} apples. Apples: <b id="sc">0</b></p>`;const x=canvas(c,N*S,N*S).getContext('2d');
let sn=[{x:8,y:8},{x:7,y:8},{x:6,y:8}],dir={x:1,y:0},nd=dir,f,sc=0;
const pl=()=>{do{f={x:rnd(N),y:rnd(N)}}while(sn.some(s=>s.x===f.x&&s.y===f.y))};pl();
const dr=()=>{x.fillStyle='#0f172a';x.fillRect(0,0,N*S,N*S);x.fillStyle='#ef4444';x.fillRect(f.x*S+2,f.y*S+2,S-4,S-4);sn.forEach((s,i)=>{x.fillStyle=i?'#22c55e':'#86efac';x.fillRect(s.x*S+1,s.y*S+1,S-2,S-2)})};
const tn=(a,b)=>{if(a!==-dir.x||b!==-dir.y)nd={x:a,y:b}};
c.key(e=>{const m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];if(m)tn(...m)});dpad(c,tn);
c.every(()=>{dir=nd;const h={x:sn[0].x+dir.x,y:sn[0].y+dir.y};
if(h.x<0||h.y<0||h.x>=N||h.y>=N||sn.some(s=>s.x===h.x&&s.y===h.y)){dr();return c.end(false,`You crashed with ${sc} apples.`)}
sn.unshift(h);if(h.x===f.x&&h.y===f.y){$('#sc').textContent=++sc;if(sc>=goal){dr();return c.end(true,`You ate ${sc} apples!`)}pl()}else sn.pop();dr()},ms);dr()});

add('simon','Simon Says','🔴','Watch the color pattern, then repeat it.',c=>{
const T=[4,6,8,10,12][c.d-1],fl=[800,650,500,400,300][c.d-1],col=['#ef4444','#22c55e','#3b82f6','#facc15'];let sq=[],pos=0,ok=false;
c.el.innerHTML=`<p>Reach a pattern of ${T}. Round: <b id="rd">0</b></p><div id="sm"></div><p id="msg"></p>`;
const pd=col.map((k,i)=>{const b=document.createElement('button');b.className='pad';b.style.background=k;b.onclick=()=>pr(i);$('#sm').appendChild(b);return b});
const fh=i=>{pd[i].style.filter='brightness(2.2)';c.later(()=>pd[i].style.filter='',fl*.6)};
const show=()=>{ok=false;pos=0;$('#msg').textContent='Watch...';sq.forEach((s,k)=>c.later(()=>fh(s),500+k*fl));c.later(()=>{ok=true;$('#msg').textContent='Your turn!'},500+sq.length*fl)};
const nx=()=>{sq.push(rnd(4));$('#rd').textContent=sq.length;show()};
const pr=i=>{if(!ok||c.over)return;if(i!==sq[pos])return c.end(false,`You reached a pattern of ${sq.length-1}.`);fh(i);
if(++pos===sq.length){if(sq.length>=T)return c.end(true,`You repeated all ${T}!`);ok=false;c.later(nx,700)}};nx()});

add('whack','Whack-a-Mole','🐹','Whack the moles before they hide.',c=>{
const up=[1200,1000,800,650,500][c.d-1],goal=[8,10,12,14,16][c.d-1];let sc=0,cur=-1;
c.el.innerHTML=`<p>Whack ${goal} in 20 seconds. Score: <b id="sc">0</b> | Time: <b id="tm">20</b></p>`;
const g=grid(c.el,3,95),hs=[];
for(let i=0;i<9;i++){const h=document.createElement('button');h.className='cell';h.style.cssText='height:95px;font-size:44px;border:0;color:#fff';
h.onclick=()=>{if(i!==cur||c.over)return;$('#sc').textContent=++sc;h.textContent='';cur=-1;if(sc>=goal)c.end(true,`You whacked ${sc}!`)};g.appendChild(h);hs.push(h)}
const sp=()=>{if(cur>=0)hs[cur].textContent='';let n;do{n=rnd(9)}while(n===cur);cur=n;hs[n].textContent='🐹'};sp();c.every(sp,up);
tick(c,20,()=>c.end(sc>=goal,`You whacked ${sc} moles.`))});

add('hangman','Hangman','🔤','Guess the word one letter at a time.',c=>{
const w=pick(wpool(c.d)).toUpperCase(),L0=[8,7,7,6,5][c.d-1];let lv=L0;const got=new Set(),used=new Set();
c.el.innerHTML=`<p>Wrong guesses allowed: ${L0}</p><div id="wd" style="font-size:40px;letter-spacing:6px"></div><p>Lives: <b id="lv"></b></p><div id="kb"></div>`;
const up=()=>{$('#wd').textContent=[...w].map(x=>got.has(x)?x:'_').join(' ');$('#lv').textContent='❤️'.repeat(lv)||'💀'};
const gs=ch=>{if(used.has(ch)||c.over)return;used.add(ch);const b=$('#k'+ch);if(b)b.disabled=true;w.includes(ch)?got.add(ch):lv--;up();
if([...w].every(x=>got.has(x)))c.end(true,`The word was ${w}.`);else if(lv<=0)c.end(false,`The word was ${w}.`)};
[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].forEach(ch=>{const b=document.createElement('button');b.className='key';b.id='k'+ch;b.textContent=ch;b.onclick=()=>gs(ch);$('#kb').appendChild(b)});
c.key(e=>{const ch=e.key.toUpperCase();if(/^[A-Z]$/.test(ch)&&!e.ctrlKey&&!e.metaKey)gs(ch)});up()});

add('scramble','Word Scramble','🔀','Unscramble 4 words before time runs out.',c=>{
const T=[90,75,60,50,40][c.d-1],pool=wpool(c.d);let n=0,w='';
c.el.innerHTML=`<p>Solved: <b id="sv">0</b>/4 | Time: <b id="tm">${T}</b></p><div id="sc" style="font-size:44px;letter-spacing:6px"></div><input type="text" id="in" autocomplete="off"> <button class="btn" id="go">Check</button><button class="btn alt" id="sk">Skip</button><p id="fb"></p>`;
const nw=()=>{const o=w;do{w=pick(pool)}while(w===o);let s;do{s=shuffle([...w]).join('')}while(s===w);$('#sc').textContent=s.toUpperCase();$('#in').value='';$('#in').focus()};

const go=u=>{if(c.over)return;let n;do{n=1+rnd(13)}while(n===cd);const ok=u?n>cd:n<cd;$('#fb').textContent=`Next card: ${nm(n)} ${ok?'✅':'❌'}`;cd=n;ok?sc++:lv--;sh();

add('c4','Connect Four','🔵','You are red. Drop discs to get four in a row.',c=>{
const D=[0,1,2,3,4][c.d-1],R=6,C=7,b=Array.from({length:R},()=>Array(C).fill(0));let busy=false;
const wins=(p)=>{for(let r=0;r<R;r++)for(let k=0;k<C;k++)for(const [a,e] of [[0,1],[1,0],[1,1],[1,-1]]){let o=true;for(let i=0;i<4;i++){const y=r+a*i,x=k+e*i;if(y<0||y>=R||x<0||x>=C||b[y][x]!==p){o=false;break}}if(o)return true}return false};
const val=()=>[...Array(C).keys()].filter(k=>!b[0][k]);
const drop=(k,p)=>{for(let r=R-1;r>=0;r--)if(!b[r][k]){b[r][k]=p;return}};
const undo=k=>{for(let r=0;r<R;r++)if(b[r][k]){b[r][k]=0;return}};
const sc=()=>{let s=0;for(let r=0;r<R;r++)s+=b[r][3]===2?3:b[r][3]===1?-3:0;return s};
const se=(d,al,be,mx)=>{if(wins(2))return 1e5+d;if(wins(1))return -1e5-d;const v=val();if(!v.length||!d)return sc();
let best=mx?-Infinity:Infinity;for(const k of v){drop(k,mx?2:1);const s=se(d-1,al,be,!mx);undo(k);
if(mx){best=Math.max(best,s);al=Math.max(al,s)}else{best=Math.min(best,s);be=Math.min(be,s)}if(al>=be)break}return best};
const cpu=()=>{const v=val();if(!D)return pick(v);let best=-Infinity,mv=[];for(const k of shuffle(v)){drop(k,2);const s=se(D-1,-Infinity,Infinity,false);undo(k);if(s>best){best=s;mv=[k]}else if(s===best)mv.push(k)}return pick(mv)};
c.el.innerHTML='<p>You are 🔴. Click a column.</p>';const B=grid(c.el,C,52);
const dr=()=>{B.innerHTML='';for(let r=0;r<R;r++)for(let k=0;k<C;k++){const d=document.createElement('div');d.style.cssText=`height:52px;border-radius:50%;cursor:pointer;background:${['#1e293b','#ef4444','#facc15'][b[r][k]]}`;d.onclick=()=>pl(k);B.appendChild(d)}};
const pl=k=>{if(busy||c.over||b[0][k])return;drop(k,1);dr();if(wins(1))return c.end(true,'Four in a row!');if(!val().length)return c.end(null,"It's a draw.");
busy=true;c.later(()=>{drop(cpu(),2);dr();busy=false;if(wins(2))return c.end(false,'The computer got four in a row.');if(!val().length)c.end(null,"It's a draw.")},300)};dr()});

add('mines','Minesweeper','💣','Reveal every safe square. Use flag mode (or right-click) to mark mines.',c=>{
const N=8,M=[6,10,14,18,24][c.d-1];let mi=null,rv=Array(64).fill(0),fg=Array(64).fill(0),fm=false,left=64-M;
c.el.innerHTML=`<p>${M} mines. <button class="btn alt" id="fm">🚩 Flag mode: off</button></p>`;const B=grid(c.el,N,46);
const nb=i=>{const r=i/N|0,k=i%N,o=[];for(let a=-1;a<2;a++)for(let b=-1;b<2;b++){const y=r+a,x=k+b;if((a||b)&&y>=0&&y<N&&x>=0&&x<N)o.push(y*N+x)}return o};
const cn=i=>nb(i).filter(j=>mi[j]).length;
const dr=sm=>{B.innerHTML='';for(let i=0;i<64;i++){const k=document.createElement('div');k.className='cell';k.style.cssText='height:46px;font-size:22px';
if(rv[i]){k.style.background='#cbd5e1';k.style.color='#000';k.textContent=cn(i)||''}else if(sm&&mi[i])k.textContent='💣';else if(fg[i])k.textContent='🚩';
k.onclick=()=>ck(i);k.oncontextmenu=e=>{e.preventDefault();if(!rv[i]&&!c.over){fg[i]^=1;dr()}};B.appendChild(k)}};
const fl=i=>{const st=[i];while(st.length){const x=st.pop();if(rv[x]||fg[x])continue;rv[x]=1;left--;if(!cn(x))nb(x).forEach(j=>{if(!rv[j])st.push(j)})}};
const ck=i=>{if(c.over||rv[i])return;if(fm){fg[i]^=1;dr();return}if(fg[i])return;
if(!mi){mi=Array(64).fill(0);const ex=new Set([i,...nb(i)]);shuffle([...Array(64).keys()].filter(j=>!ex.has(j))).slice(0,M).forEach(j=>mi[j]=1)}
if(mi[i]){dr(true);return c.end(false,'You hit a mine!')}fl(i);dr();if(left<=0)c.end(true,'You cleared the board!')};
$('#fm').onclick=()=>{fm=!fm;$('#fm').textContent='🚩 Flag mode: '+(fm?'on':'off')};dr()});

add('2048','2048','🔢','Slide and merge tiles to reach the goal tile.',c=>{
const goal=[128,256,512,1024,2048][c.d-1];let g=Array.from({length:4},()=>Array(4).fill(0));
c.el.innerHTML=`<p>Reach the ${goal} tile. Arrow keys or buttons.</p>`;const B=grid(c.el,4,80);
const ad=()=>{const e=[];g.forEach((r,i)=>r.forEach((v,j)=>{if(!v)e.push([i,j])}));if(e.length){const [i,j]=pick(e);g[i][j]=Math.random()<.9?2:4}};
const sl=r=>{const a=r.filter(v=>v);for(let i=0;i<a.length-1;i++)if(a[i]===a[i+1]){a[i]*=2;a.splice(i+1,1)}while(a.length<4)a.push(0);return a};
const mv=d=>{const o=JSON.stringify(g);
if(d===0)g=g.map(sl);else if(d===1)g=g.map(r=>sl(r.slice().reverse()).reverse());
else for(let j=0;j<4;j++){let col=g.map(r=>r[j]);col=d===2?sl(col):sl(col.reverse()).reverse();col.forEach((v,i)=>g[i][j]=v)}return JSON.stringify(g)!==o};
const dead=()=>{for(let i=0;i<4;i++)for(let j=0;j<4;j++){if(!g[i][j])return false;if(j<3&&g[i][j]===g[i][j+1])return false;if(i<3&&g[i][j]===g[i+1][j])return false}return true};
const dr=()=>{B.innerHTML='';g.flat().forEach(v=>{const k=document.createElement('div');k.className='cell';k.style.cssText=`height:80px;font-size:${v>999?24:32}px;background:${v?`hsl(${Math.log2(v)*32},70%,45%)`:'#0006'}`;k.textContent=v||'';B.appendChild(k)})};
const go=d=>{if(c.over)return;if(mv(d)){ad();dr();if(g.flat().some(v=>v>=goal))c.end(true,`You made ${goal}!`);else if(dead())c.end(false,'No moves left.')}};
const mp=(x,y)=>go(x<0?0:x>0?1:y<0?2:3);
c.key(e=>{const d={ArrowLeft:0,ArrowRight:1,ArrowUp:2,ArrowDown:3}[e.key];if(d!==undefined)go(d)});dpad(c,mp);ad();ad();dr()});

add('pong','Pong','🏓','Beat the computer paddle. First to 5. Move with mouse, finger, or ↑/↓.',c=>{
const W=480,H=300,ph=[90,75,65,55,50][c.d-1],as=[2,2.8,3.5,4.2,5][c.d-1],bs=[3.5,4,4.5,5,5.5][c.d-1];
const cv=canvas(c,W,H),x=cv.getContext('2d');let py=H/2-ph/2,ay=py,me=0,cp=0,b;
const sv=d=>{b={x:W/2,y:H/2,vx:d*bs,vy:(Math.random()*2-1)*bs*.6}};sv(1);
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();py=(e.clientY-r.top)*(H/r.height)-ph/2});
c.key(e=>{if(e.key==='ArrowUp')py-=22;if(e.key==='ArrowDown')py+=22});
c.loop(()=>{py=clamp(py,0,H-ph);ay=clamp(ay+clamp(b.y-ph/2-ay,-as,as),0,H-ph);b.x+=b.vx;b.y+=b.vy;
if(b.y<6||b.y>H-6){b.vy=-b.vy;b.y=clamp(b.y,6,H-6)}
if(b.vx<0&&b.x<=24&&b.x>=10&&b.y>=py-6&&b.y<=py+ph+6){b.vx=-b.vx*1.06;b.vy+=(b.y-py-ph/2)/(ph/2)*2}
if(b.vx>0&&b.x>=W-24&&b.x<=W-10&&b.y>=ay-6&&b.y<=ay+ph+6){b.vx=-b.vx*1.06;b.vy+=(b.y-ay-ph/2)/(ph/2)*2}
b.vy=clamp(b.vy,-8,8);let end=null;
if(b.x<-10){cp++;sv(1)}else if(b.x>W+10){me++;sv(-1)}
x.fillStyle='#0f172a';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.fillRect(10,py,10,ph);x.fillRect(W-20,ay,10,ph);
x.beginPath();x.arc(b.x,b.y,6,0,7);x.fill();x.font='24px sans-serif';x.fillText(`${me}   ${cp}`,W/2-30,28);
if(me>=5)c.end(true,`You won ${me} to ${cp}.`);else if(cp>=5)c.end(false,`You lost ${me} to ${cp}.`)})});

x.fillStyle='#0f172a';x.fillRect(0,0,W,H);br.forEach(b=>{x.fillStyle=`hsl(${b.hue},80%,55%)`;x.fillRect(b.x,b.y,45,16)});

const nb=z=>{const r=z/n|0,k=z%n,o=[];if(r>0)o.push(z-n);if(r<n-1)o.push(z+n);if(k>0)o.push(z-1);if(k<n-1)o.push(z+1);return o};
const solved=()=>t.every((v,i)=>v===(i+1)%NN);
do{let z=NN-1;for(let i=0;i<sh;i++){const j=pick(nb(z));[t[z],t[j]]=[t[j],t[z]];z=j}}while(solved());
c.el.innerHTML=`<p>Moves: <b id="mv">0</b> <button class="btn alt" id="gu">Give up</button></p>`;const B=grid(c.el,n,n===3?90:75);
const dr=()=>{B.innerHTML='';t.forEach((v,i)=>{const k=document.createElement('div');k.className='cell';k.style.cssText=`height:${n===3?90:75}px;font-size:34px;${v?'':'background:#0006'}`;k.textContent=v||'';k.onclick=()=>{if(c.over)return;const z=t.indexOf(0);if(nb(z).includes(i)){[t[z],t[i]]=[t[i],t[z]];$('#mv').textContent=++m;dr();if(solved())c.end(true,`Solved in ${m} moves!`)}};B.appendChild(k)})};
$('#gu').onclick=()=>c.end(false,'You gave up.');dr()});

add('bj','Blackjack','🂡','Beat the dealer hands to win the match. Get close to 21 without going over.',c=>{
const WN=[2,2,3,3,4][c.d-1],ST=[15,16,17,17,18][c.d-1];let me=0,dl=0,ph,dh,pl=false;
const dw=()=>1+rnd(13),vl=h=>{let t=h.reduce((a,r)=>a+Math.min(r,10),0);if(h.includes(1)&&t+10<=21)t+=10;return t},nm=r=>({1:'A',11:'J',12:'Q',13:'K'}[r]||r);
c.el.innerHTML=`<p>First to ${WN} hands wins.</p><p id="sc"></p><p>Dealer: <b id="dh"></b></p><p>You: <b id="ph"></b></p><button class="btn" id="ht">Hit</button><button class="btn alt" id="sd">Stand</button><p id="fb"></p>`;
const sh=hide=>{$('#ph').textContent=ph.map(nm).join(' ')+' = '+vl(ph);$('#dh').textContent=hide?nm(dh[0])+' ?':dh.map(nm).join(' ')+' = '+vl(dh);$('#sc').textContent=`You ${me} | Dealer ${dl}`};
const se=(msg,w)=>{pl=false;w>0?me++:w<0&&dl++;sh(false);$('#fb').textContent=msg;
if(me>=WN)return c.end(true,`Final: ${me} to ${dl}.`);if(dl>=WN)return c.end(false,`Final: ${me} to ${dl}.`);c.later(dealH,1800)};
const dealH=()=>{ph=[dw(),dw()];dh=[dw(),dw()];pl=true;$('#fb').textContent='Hit or stand?';sh(true);if(vl(ph)===21)sd()};
const ht=()=>{if(!pl||c.over)return;ph.push(dw());sh(true);if(vl(ph)>21)se('Bust! Dealer wins the hand.',-1);else if(vl(ph)===21)sd()};
const sd=()=>{if(!pl||c.over)return;while(vl(dh)<ST)dh.push(dw());const p=vl(ph),d=vl(dh);
if(d>21)se('Dealer busts! You win the hand.',1);else if(p>d)se('You win the hand!',1);else if(p<d)se('Dealer wins the hand.',-1);else se('Push, no point.',0)};
$('#ht').onclick=ht;$('#sd').onclick=sd;dealH()});

const T=$('#tiles');
G.forEach((g,i)=>{const b=document.createElement('button');b.className='tile';b.style.background=`hsl(${i*14},65%,42%)`;b.innerHTML=`<span>${g.em}</span>${g.name}`;b.onclick=()=>openGame(g.id);T.appendChild(b)});
const sb=document.createElement('button');sb.className='tile';sb.style.background='#0f172a';sb.innerHTML='<span>🎲</span>Surprise Me';sb.onclick=()=>openGame(pick(G).id);T.appendChild(sb);
render();
</script></body></html>
